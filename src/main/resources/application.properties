# ─── Hibernate ORM ───────────────────────────────────────────────────────────

# Rebuild the schema from the Java entities on every start. This makes the
# entity classes the single source of truth while learning. Never use this in
# production — it drops your tables.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Print every SQL statement Hibernate generates, formatted. This is the fastest
# way to see what the ORM is actually doing on your behalf.
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# ─── Feed polling ────────────────────────────────────────────────────────────

feeds.poll.interval=5m
feeds.poll.enabled=true

# Background fetches would race the assertions in every other test, so polling is
# off under the test profile. The job is still registered — only its execution is
# skipped — which keeps the wiring under test.
%test.feeds.poll.enabled=false
%test.feeds.poll.interval=24h

# ─── HTTP ────────────────────────────────────────────────────────────────────

# @QuarkusTest boots a real HTTP server. Its default test port is 8081, which
# collides with anything else already using it. 0 means "ask the OS for a free
# port"; the test framework points RestAssured at whatever it gets, so tests
# never fail because of an unrelated container on this machine.
quarkus.http.test-port=0

# ─── Datasource ──────────────────────────────────────────────────────────────

# There is deliberately NO quarkus.datasource.jdbc.url here.
#
# Its absence is the trigger: in dev and test mode Quarkus sees a JDBC driver on
# the classpath but no URL configured, and starts a PostgreSQL container for you
# via Testcontainers. That is Dev Services. In production the URL must be
# supplied (env var, config file) or the app will refuse to start.
